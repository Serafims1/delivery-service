services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./alembic.ini:/app/alembic.ini
      - ./migrations:/app/migrations

    command:
      - uvicorn
      - delivery_service.main:app
      - --app-dir
      - src
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    init: true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./alembic.ini:/app/alembic.ini
      - ./migrations:/app/migrations

    environment:
      PYTHONPATH: /app/src

    command:
      - python
      - -m
      - delivery_service.messaging.run_worker

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    init: true
    restart: unless-stopped

  publisher:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./alembic.ini:/app/alembic.ini
      - ./migrations:/app/migrations

    environment:
      PYTHONPATH: /app/src

    command:
      - python
      - -m
      - delivery_service.messaging.run_publisher

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    init: true
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "2026project2026"

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d delivery
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 10

    restart: unless-stopped

  postgres_test:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: delivery_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "2026project2026"

    ports:
      - "127.0.0.1:5433:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d delivery_test
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 10

  redis:
    image: redis:7-alpine

    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10

    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine

    environment:
      RABBITMQ_DEFAULT_USER: delivery_user
      RABBITMQ_DEFAULT_PASS: "2026project2026"

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10

    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data: